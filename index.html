<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>

<body>

  <!-- ===== J.A.R.V.I.S CINEMATIC BOOT SEQUENCE ===== -->
  <div id="bootScreen" class="boot-screen">
    <div class="boot-particles" id="bootParticles"></div>

    <div class="hud-rings">
      <div class="hring ring-a"></div>
      <div class="hring ring-b"></div>
      <div class="hring ring-c"></div>
    </div>

    <div class="ai-core" id="aiCore">
      <div class="core-point"></div>
      <div class="core-pulse"></div>
      <div class="core-scanline"></div>
    </div>

    <div class="boot-text">
      <h1 id="onlineText" class="online-text">J.A.R.V.I.S. ONLINE</h1>
      <p id="greetText" class="greet-text">GOOD MORNING, SIR.</p>
      <button id="initBtn" class="init-btn">
        <span class="init-sweep"></span>
        <span>INITIALIZE J.A.R.V.I.S.</span>
      </button>
    </div>
  </div>


  <!-- LOGIN / SIGNUP SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <h2>J.A.R.V.I.S ACCESS</h2>

      <input
        type="email"
        id="authEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="authPassword"
        placeholder="Password"
      >

      <button id="loginBtn">LOGIN</button>
      <button id="signupBtn">SIGN UP</button>

      <p id="authError"></p>
    </div>
  </div>


  <!-- J.A.R.V.I.S HUD -->
  <div class="hud">

    <div class="topbar">
      <span class="logo">● J.A.R.V.I.S.</span>
      <span id="statusBadge" class="badge">SYSTEM ONLINE</span>
    </div>

    <div id="jarvisReply" class="jarvis-reply">
      Systems ready.
    </div>


    <!-- DATA PANELS -->
    <div class="data-panels">

      <div class="panel">

        <div class="panel-title">
          VISION SYSTEM
        </div>

        <div class="row">
          <span>OPTICAL</span>
          <span id="optical">ACTIVE</span>
        </div>

        <div class="bar">
          <div
            class="fill"
            id="opticalBar"
            style="width:100%"
          ></div>
        </div>

        <div class="row">
          <span>SCAN</span>
          <span id="scanPct">0%</span>
        </div>

        <div class="bar">
          <div
            class="fill"
            id="scanBar"
            style="width:0%"
          ></div>
        </div>

        <div class="row">
          <span>TRACKING</span>
          <span id="tracking">READY</span>
        </div>

      </div>


      <div class="panel">

        <div class="panel-title">
          SYSTEM DATA
        </div>

        <div class="row">
          <span>CORE</span>
          <span>ONLINE</span>
        </div>

        <div class="row">
          <span>VISION</span>
          <span id="visionState">OFF</span>
        </div>

        <div class="row">
          <span>OBJECTS</span>
          <span id="objCount">0</span>
        </div>

        <div class="row">
          <span>MODE</span>
          <span>JARVIS</span>
        </div>

      </div>

    </div>


    <!-- CAMERA / VISION -->
    <div class="video-wrap" id="videoWrap">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <canvas id="overlay"></canvas>


      <!-- STANDBY HUD -->
      <div
        class="standby-hud"
        id="standbyHud"
      >

        <div class="grid-bg"></div>

        <div class="radar-ring r1"></div>
        <div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div>

        <div class="radar-sweep"></div>

        <div class="core-glow"></div>

        <div class="corner cTL"></div>
        <div class="corner cTR"></div>
        <div class="corner cBL"></div>
        <div class="corner cBR"></div>

      </div>

    </div>


    <div
      id="detectedText"
      class="detected-text"
    >
      CAMERA STANDBY
    </div>


    <!-- VISION BUTTONS -->
    <button id="visionBtn">
      ▶ START VISION
    </button>

    <button id="readTextBtn">
      📖 READ & SEARCH PRODUCT
    </button>


    <!-- MIC / VOICE / LANGUAGE -->
    <div class="btn-row">

      <button id="micBtn">
        🎤
      </button>

      <button id="langBtn">🌐 EN</button>

      <select id="voiceSelect"></select>

    </div>


    <!-- CHAT -->
    <div id="chatBox"></div>

  </div>


  <!-- FIREBASE CONFIG -->
  <script>

    const firebaseConfig = {

      apiKey: "AIzaSyA-gh9T2w_m1ulX2NQoUseSQKqEYAExorc",

      authDomain: "jarvi-f7519.firebaseapp.com",

      projectId: "jarvi-f7519",

      storageBucket: "jarvi-f7519.firebasestorage.app",

      messagingSenderId: "1074803997220",

      appId: "1:1074803997220:web:7bc4139cb518c832a2b6b1",

      measurementId: "G-MMMEFQJ0YZ"

    };


    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

  </script>


  <!-- AI / VISION LIBRARIES -->

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


  <!-- JARVIS SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
