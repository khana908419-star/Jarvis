<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="orb" id="orb"></div>
      <h1>J.A.R.V.I.S.</h1>
      <p class="status" id="status">System Online</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">Hello. I am Jarvis. How can I help you today?</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a command... e.g. weather in Delhi">
      <button id="sendBtn">➤</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
